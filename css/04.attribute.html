<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">

     <!-- 디자인을 작성하기 위한 영역 -->
    <style>
         *{ /* 전체에게 설정한다! */
            /* 이제부터 폭과 높이는 테두리가 기준이야 */
            box-sizing: border-box;
        }
       input{
        /* 글꼴 속성(font-family) */
        font-family: 굴림, sans-serif;
        font-size: 24px;
        /* font-weight: 900; */
        /* font-style: italic; */
       }
        .first{
             /* 배경 속성 (background-*) */

        /* css1 */
        background-color: rgb(149, 175, 192);

        /* css3 */
        /* background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(48, 134, 152, 1) 8%, rgba(87, 199, 139, 1) 76%, rgba(237, 221, 83, 1) 100%); */
        }
        .second{
            /* 테두리 디자인 (boarder-*) */
            border-width: 2px;
            border-style: solid;
            border-color: rgb(34, 166, 179);

            border-radius: 5px;
            /* border-radius: 100px; */
            /* border-radius: 50%; */

            /* 입력창과 같이 포커스 효과가 있는 경우 제거하는 속성 */
            outline: none;

            /* 
                내부 여백 (padding)
                - 글자가 중요한 태그라면(input, button 등) em을 쓸 수 있음
                - 1em은 글자1개의 높이
                - px로도 부여할 수 있으니 상황에 맞게 선택하여 부여
                - 부위별로 부여도 가능(top, bottom, left, right)
                - 2개로 나눠쓰면 상하 /좌우
                - 4개로 나눠쓰면 12시 / 3시/ 6시 / 9시 방향을 의미
            */
            /* padding: 10px; */
            /* padding: 1em; */
            /* padding: 0.5em 1em; */
            /* padding: 5px 10px 15px 20px; */
            padding: 0.5em;
            padding-left: 2em;
        }
        .third{
        /*
            크기설정(width, height)
        */
        width: 300px;
        }
    </style>
</head>
<body>
    <h1>기본 디자인 속성들</h1>
    <input type="text" class="first">
    <br><br>
    <input type="text" class="second">
    <br><br>
    <input type="text" class="third">

</body>
</html>
