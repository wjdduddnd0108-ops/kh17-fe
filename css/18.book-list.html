<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
    
    </style>
</head>
<body>
    <div class="container w-600">
        <div class="cell center">
            <h1>도서 목록</h1>
        </div>
        <div class="cell">
            <form autocomplete="off" class="field">
                <select name="column" class="field">
                    <option value="book_title">책 제목</option>
                    <option value="book_author">책 저자</option>
                    <option value="book_publisher">출판사</option>
                    <option value="book_genre">장르</option>
                </select>
                <input type="text" name="keyword" required
                class="field" placeholder="검색어 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>
            </form>
        </div>
        <div class="cell">
            <a href="#" class="btn btn-neutral">신규 등록하기</a>
        </div>
        <!-- 데이터 테이블 -->
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>저자</th>
                        <th>출간일</th>
                        <th>가격</th>
                        <th>출판사</th>
                        <th>페이지 수</th>
                        <th>장르</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>3</td>
                        <td>삼국지</td>
                        <td>나관중</td>
                        <td>1522-01-01</td>
                        <td>30,000</td>
                        <td>민음사</td>
                        <td>850</td>
                        <td>역사</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>데미안</td>
                        <td>헤르만 헤세</td>
                        <td>1919-01-01</td>
                        <td>40,000</td>
                        <td>민음사</td>
                        <td>500</td>
                        <td>소설</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>토지</td>
                        <td>박경리</td>
                        <td>1969-01-01</td>
                        <td>15,000</td>
                        <td>민음사</td>
                        <td>200</td>
                        <td>소설</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
                <a href="#">
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
