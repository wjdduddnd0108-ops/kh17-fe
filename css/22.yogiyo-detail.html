<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요기요</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
        div{
            /* box-shadow: 0 0 0 1px; */
        }
        .outer{
            width: 50%;
            padding: 5px 10px;
        }
        .outer > .inner {
           box-shadow: 0 0 0 1px gray;
           padding: 1em;
        }
        .shop-name {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container w-1000">

            <h1>요기요 매장 목록</h1>
        </div>
        <div class="cell">
            <div class="float-area">
                <div class="outer">
                    <div class="inner">
                        
                        <div class="float-area">
                            <div class="w-20">
                                <img src="https://www.dummyimage.com/500x500?text=M" width="100%">
                            </div>
                            <div class="w-80" style="padding-left: 15px;">
                                <h2 class="shop-name">서울숲쭈꾸미-강남역점</h2>
                                <div>

                                    <span class="yellow me-10">
                                        <i class="fa-solid fa-star"></i> 4.8
                                    </span>
                                    |
                                    <span class="black ms-10 me-10">리뷰 83</span> 
                                    |

                                </div>
                                <div>
                                    <span class="red me-10">요기서결제</span>
                                    |
                                    <span class="gray ms-10">8,500원 이상 배달</span>
                                </div>
                                <div class="float-area">
                                    <div class="w-50">
                                        <!-- 세스코,즉시할인 등이 표시될 영역 -->
                                        &nbsp;
                                    </div>
                                    <div class="w-50 right gray">25~40분</div>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
</body>
