<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
    
    </style>
</head>
<body>
    <div class="container w-600">
        <div class="cell center">
            <h1>자유게시판</h1>
        </div>
        타인에 대한 무분별한 비방글은 예고 없이 삭제될 수 있습니다
        
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>게시판 번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                        <th>좋아요</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>10</td>
                        <td>테스트글</td>
                        <td>testuser1</td>
                        <td>2026-03-13</td>
                        <td>10</td>
                        <td>5</td>
                    </tr>
                     <tr>
                        <td>11</td>
                        <td>테스트글2</td>
                        <td>testuser1</td>
                        <td>2026-04-13</td>
                        <td>100</td>
                        <td>20</td>
                    </tr>
                     <tr>
                        <td>12</td>
                        <td>테스트글3</td>
                        <td>testuser1</td>
                        <td>2026-01-13</td>
                        <td>500</td>
                        <td>50</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <a href="#" class="btn btn-neutral">글쓰기</a>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
                <a href="#">
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
        <div class="cell">
            <form autocomplete="off" class="field">
                <select name="column" class="field">
                    <option value="board_title">제목</option>
                    <option value="board-writer">작성자</option>
                </select>
                <input type="text" name="keyword"
                class="field" placeholder="검색어를 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>   
                    <span>검색</span>
                </button>
            </form>
        </div>
        
    </div>
</body>
</html>
