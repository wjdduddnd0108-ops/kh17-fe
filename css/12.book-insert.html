<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 정보 입력</title>
     <link rel="icon" href="/kh.png" type="image/png">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
    
    </style>
</head>
<body>
    <form autocomplete="off" method="post" enctype="multipart/form-data">
        <div class="container w-500 mt-50 mb-50">
            <div class="cell center">
                <h1>신규 도서 등록</h1>
            </div>
            <div class="cell">
                <label>도서명 *</label>
                <input type="text" name="bookTitle"
                class="field w-100" required>
            </div>
            <div class="cell">
                <label>지은이</label>
                <input type="text" name="bookAuthor"
                class="field w-100">
            </div>
            <div class="cell">
                <label>출간일</label>
                <input type="date" name="bookPublicationDate"
                class="field w-100">
            </div>
            <div class="cell">
                <label>판매가 *</label>
                <input type="text" name="bookPrice"
                class="field w-100" inputmode="numeric" required>
            </div>
            <div class="cell">
                <label>출판사</label>
                <input type="text" name="bookPublisher"
                class="field w-100">
            </div>
            <div class="cell">
                <label>페이지 수 *</label>
                <input type="text" name="bookPageCount"
                class="field w-100" required inputmode="numeric">
            </div>
            <div class="cell">
                <label>장르 *</label>
                <select class="field w-100" name="bookGenre" required>
                    <option value="">선택하세요</option>
                    <option>판타지</option>
		            <option>교양</option>
		            <option>소설</option>
		            <option>역사</option>
		            <option>과학</option>
		            <option>추리소설</option>
		            <option>자기계발</option>
		            <option>수험서</option>
                </select>
            </div>
            <div class="cell">
                <label>책 표지</label>
                <input type="file" name="attach" accept=".png, .jpg" 
                class="field w-100">
            </div>
            <div class="cell mt-40">
                <button class="btn btn-positive w-100">
                    등록하기
                </button>
            </div>
            <div class="cell mt-40">
                <button class="btn btn-neutral w-100">
                    목록으로
                </button>
            </div>
        </div>
    </form>
</body>
</html>
