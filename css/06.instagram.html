<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
     <link rel="icon" href="/인스타그램.png" type="image/png">

     <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        *{ /* 전체에게 설정한다! */
            /* 이제부터 폭과 높이는 테두리가 기준이야 */
            box-sizing: border-box;
        }
        body{
            text-align: center;
        }

        h3{
            width: 530px;
            text-align: left;
            margin: 30px auto;
        }

        input{
             font-family: sans-serif;
             font-size: 20px;
             width: 530px;
             padding: 0.75em;
             outline: none;
             border-radius: 0.75em;
             margin: 15px auto;
             display: block;
             border-style: solid;
             border-color: rgb(149, 165, 166);
             border-width: 1px;
            
        }
        div{
            width: 530px;
            margin: 0 auto;
            text-align: left;
            font-weight: 900;
        }
        button{
            font-family: sans-serif;
            font-size: 20px;
            font-weight: bold;
            width: 530px;
            padding: 0.5em;
            background-color: rgb(52, 152, 219);
            color: white;
            border-width: 0px;
            border-style: solid;
            display: block;
            margin: 25px auto;
            border-radius: 100px;
            outline: none;
        }
    
        hr{
            width: 530px;
            margin-top: 20px;
            margin-bottom: 100px;
        }
        a{
            color: black;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <img src="/인스타그램.png" width="100">
    <hr>

    <h3>instagram으로 로그인</h3>
    
    <form autocomplete="">
        <input type="text" name="memberId" required
                placeholder="휴대폰 번호, 사용자 이름 또는 이메일 주소">
        <input type="text" name="memberPassword" required
                placeholder="비밀번호">
        <button>로그인</button>
    </form>

    <a href="#">비밀번호를 잊으셨나요?</a>
</body>
</html>
