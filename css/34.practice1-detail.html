<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
        div{
            box-shadow: 0 0 0 1px;
        }
    </style>
</head>
<body>
    <div class="container w-800 mt-50 mb-50">
        <div class="cell">
            <h1>강좌 상세정보</h1>
        </div>
        <div class="flex-area">
                <div class="cell">
                    <h2>이미지 미리보기</h2>
                    <img src="https://www.dummyimage.com/160x110?text=M" width="100%">
                </div>
        </div>
        <div class="flex-area">
            <div class="flex-vertical w-75">
                    <div class="cell">
                        강좌 코드 : <span>3</span>
                    </div>
                    <div class="cell">
                        강좌 카테고리 : <span>시험</span>
                    </div>
                    <div class="cell">
                        강좌명 : <span>정보처리기사 필기</span>
                    </div>
                    <div class="cell">
                        강의시간(H) : <span>30 H</span>
                    </div>
                    <div class="cell">
                        수강료 : <span>300000 KRW</span>
                    </div>
                    <div class="cell">
                        강좌 유형 : <span>혼합</span>
                    </div>
                </div>
        </div>     
        <div class="cell right">
            <a href="#" class="btn btn-positive">신규등록</a>
            <a href="#" class="btn btn-neutral">목록으로</a>
            <a href="#" class="btn btn-neutral">수정</a>
            <a href="#" class="btn btn-negative">삭제</a>
        </div>
    </div>
</body>
</html>
