<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
        div{
            box-shadow: 0 0 0 1px;
        }

    </style>
</head>
<body>
    <div class="container w-800 mt-50 mb-50">
        <div class="cell">
            <h2>국가 상세정보</h2>
        </div>
        <div class="flex-area">
            <div class="cell w-25">
                <img src="https://www.dummyimage.com/160x110?text=M" width="100%">
            </div>
            <div class="flex-vertical w-75" style="margin-left: 50px;">
                <h2>나라이름</h2>
                <span class="blue">아시아</span>대륙에 속해있으며 수도 이름은 <span class="blue">베이징</span>입니다.
                이 나라의 인구는 <span class="blue">1,412,000,000</span> 명 입니다.
            </div>
        </div>
        <div class="cell right">
            <a href="#" class="btn btn-positive">신규등록</a>
            <a href="#" class="btn btn-neutral">목록으로</a>
            <a href="#" class="btn btn-neutral">수정</a>
            <a href="#" class="btn btn-negative">삭제</a>
        </div>
    </div>
</body>
</html>
