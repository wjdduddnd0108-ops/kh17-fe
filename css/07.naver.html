<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 : 로그인</title>
     <link rel="icon" href="/네이버.png" type="image/png">

     <!-- 디자인을 작성하기 위한 영역 -->
    <!-- <link rel="stylesheet" href="./commons.css" type="text/css"> -->

    <style>
        *{ 
            box-sizing: border-box;
        }
         /* 영역을 시각적으로 보이게 만드는 테스트 코드 */
        div{
            /* box-shadow: 우 하 번짐 퍼짐; */
            box-shadow: 0 0 0 1px rgb(149, 165, 166);
        }

        /* 컨테이너 디자인 */
        .container{
            width: 410px;
            margin: 50px auto;
        }
        /* 셀 디자인 */
        .cell{
            margin-top: 10xp;
            margin-bottom: 10px;
        }
        /* 유틸리티 디자인 */
        .center{
            text-align: center;
        }


        input[name=memberId]{
            width: 100%;
            font-family: sans-serif;
            font-size: 20px;
            padding: 0.75em;
            outline: none;
            border-top-left-radius: 0.4em;
            border-top-right-radius: 0.4em;
            border-style: solid;
            border-color: rgb(149, 165, 166);
            border-width: 1px;
        }
        input[name=memberPassword]{
            width: 100%;
            font-family: sans-serif;
            font-size: 20px;
            padding: 0.75em;
            outline: none;
            border-bottom-left-radius: 0.4em;
            border-bottom-right-radius: 0.4em;
            border-style: solid;
            border-color: rgb(149, 165, 166);
            border-width: 1px;
        }
       .btn-login{
        width: 100%;
        font-family: sans-serif;
        font-size: 20px;
        font-weight: bold;
        padding: 0.5em;
        background-color: rgb(127, 140, 141);
        color: white;
        border-width: 0px;
        border-radius: 0.4em;
       }
       .btn-passkey{
        width: 100%;
        font-family: sans-serif;
        font-size: 20px;
        font-weight: bold;
        color: rgb(46, 204, 113);
        padding: 0.5em;
        border-radius: 0.4em;
        border-style: solid;
        border-color: rgb(46, 204, 113);
        border-width: 2px;
        background-color: white;
       }


    </style>
</head>
<body>
    <div class="container">
        <div class="cell center">
             <img src="/네이버.png" width="200">
        </div>
        <div class="cell" style="margin-bottom: -0.1px; margin-top: 40px;">
             <input type="text" name="memberId" required
                    placeholder="아이디 또는 전화번호">
        </div>
        <div class="cell">
            <input type="text" name="memberPassword" required
                placeholder="비밀번호">
        </div>
        <div class="cell" style="color: rgb(149, 165, 166);">
            <input type="checkbox">로그인 상태 유지
        </div>
        <div class="cell" style="margin-bottom: 40px;">
            <button class="btn-login">로그인</button>
        </div>
        <hr>
        <div class="cell">
            <button class="btn-passkey">패스키 로그인</button>
        </div>
        
    </div>
</body>
</html>
