<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
    
    </style>
</head>
<body>
    <div class="container w-600">
        <div class="cell center">
            <h1>강좌 목록</h1>
        </div>
        <div class="cell">
            <form autocomplete="off" class="field">
                <select name="column" class="field">
                    <option value="practice1_name">강좌명</option>
                    <option value="practice1_category">카테고리</option>
                    <option value="practice1_course_type">수업형태</option>
                </select>
                <input type="text" name="keyword" required
                class="field" placeholder="검색어 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>
            </form>
        </div>
        <div class="cell">
            <a href="#" class="btn btn-neutral">신규 등록하기</a>
        </div>
        <!-- 데이터 테이블 -->
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>강좌번호</th>
                        <th>강좌이름</th>
                        <th>카테고리</th>
                        <th>수강시간</th>
                        <th>수강가격</th>
                        <th>수업형태</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2</td>
                        <td>정처기 필기</td>
                        <td>이론</td>
                        <td>60</td>
                        <td class="right">500,000</td>
                        <td>온라인</td>
                    </tr>
                     <tr>
                        <td>3</td>
                        <td>연습강좌</td>
                        <td>이론</td>
                        <td>60</td>
                        <td class="right">300,000</td>
                        <td>온라인</td>
                    </tr>
                     <tr>
                        <td>4</td>
                        <td>테스트 강좌</td>
                        <td>시험</td>
                        <td>60</td>
                        <td class="right">100,000</td>
                        <td>혼합</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
                <a href="#">
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </div> 
</body>
</html>
