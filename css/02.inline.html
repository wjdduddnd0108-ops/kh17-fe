<!-- 
    Doctype은 문서의 유형과 버전을 정의할 때 사용 
    - html 이라고만 말하면 HTML 버전 5를 의미한다 (HTML5)
    - 4 이하를 사용하고 싶다면 태그 정보를 옆에 주소 형태로 적어야 한다

    <html>은 문서의 범위를 설정할 때 사용하지만 안만들어도 자동생성이 된다
        <head>에는 문서의 정보와 화면에 표시되지 않는 도구들을 설정한다
            <meta>는 이 문서를 외부에서 바라봤을 때 알 수 있는 정보들이다
            <title>은 문서의 제목이다
        <body>에는 실제 화면에 표시될 내용들을 작성한다
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 예제</title>

    <!-- favicon 설정 -->
   <link rel="icon" href="/kh.png" type="image/png">

</head>
<body>
    
</body>
</html>
