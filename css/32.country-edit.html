<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
    
    </style>
</head>
<body>
    <form autocomplete="off">
    <div class="container w-500 mt-50 mb-50">
        <div class="cell center">
            <h1>국가 정보 등록</h1>
        </div>
        <div class="cell">
            <label>대륙명</label>
            <select class="field w-100" name="countryRegion" required>
                <option value="">선택하세요</option>
                <option>아시아</option>
                <option>아프리카</option>
                <option>북아메리카</option>
                <option>남아메리카</option>
                <option>유럽</option>
                <option>오세아니아</option>
            </select>
        </div>
        <div class="cell">
            <label>국가명 *</label>
            <input type="text" name="countryName"
                class="field w-100" required
                placeholder="e.g., 대한민국">
        </div>
        <div class="cell">
            <label>수도명 *</label>
            <input type="text" name="countryCapital"
                class="field w-100" required
                placeholder="e.g., 서울">
        </div>
        <div class="cell">
            <label>인구수 *</label>
            <input type="text" inputmode="numeric"
                name="countryPopulation"
                class="field w-100"required
                placeholder="e.g., 55000000">
        </div>
        <div class="cell mt-40">
            <button class="btn btn-positive w-100">등록하기</button>
        </div>
         <div class="cell mt-40">
            <a href="./list" class="btn btn-neutral w-100">목록으로</a>
        </div>
    </div>
    </form>
</body>
</html>
