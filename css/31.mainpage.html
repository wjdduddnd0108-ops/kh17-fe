<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
        /* 메뉴 디자인 */
        div{
            /* box-shadow: 0 0 0 1px; */
        }

        .menu,
        .menu ul{
            background-color: #2c3e50;
            color: white;
        }
        .menu a{
            color: inherit;
            background-color: inherit;
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }
        .menu li:hover{
            background-color: #636e72;
        }
    </style>
</head>
<body>
    <div class="container w-1200 mt-50 mb-50">
        <div class="flex-area flex-vertical">
                <!-- 헤더 -->
            <div class="flex-area">
                <div class="w-25 flex-area flex-center ">
                    <img src="https://www.dummyimage.com/200x50">
                </div>
                <div  class="w-50 center">
                    <h1>KH정보교육원 홈페이지</h1>
                </div>
                <div class="w-25 flex-area flex-center flex-vertical">
                    <h2 class="mb-0">
                        24시간 상담
                        <i class="fa-solid fa-phone"></i>
                    </h2>
                    <span>1588-0000</span>
                </div>
            </div>

            <!-- 메뉴 -->
            <div>
                <ul class="menu">
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-home"></i>
                            홈
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-database"></i>
                            데이터
                        </a>
                        <ul>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-flag"></i>
                                    <span>국가정보</span>
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                    강좌정보
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-book"></i>
                                    도서정보
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-comments"></i>
                            게시판
                        </a>
                    </li>
                    <li class="divider"></li>
    
                    <li>
                        <a href="#" style="white-space: nowrap;">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>마이페이지</span>
                        </a>
                        <ul>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-user-plus"></i>
                                    회원가입
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

            <!-- 사이드바 및 컨텐츠 -->
            <div class="flex-area" style="min-height: 450px;">
                <div class="w-200">
                    <div class="cell center">
                        <h3>비회원 상태</h3>
                        <div class="flex-area flex-vertical mb-10">
                            <a href="#">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                로그인
                            </a>
                            <a href="#">
                                <i class="fa-solid fa-user-plus"></i>
                                회원가입
                            </a>
                        </div>
                        <!-- 이미지와 글자를 겹쳐서 배치하기 위해 영역을 설정하고 내부에 요소 배치 -->
                        <div class="cell center">
                            <div class="image-hover image-circle">
                                <img src="https://www.dummyimage.com/150x150">
                                <div class="content">
                                    <a href="#" class="white">
                                        <i class="fa-solid fa-user"></i>
                                        <span>내 정보 보기</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cell center">
                        <h3>OOO님 (브론즈)</h3>
                    </div>

                </div>
                <div class="w-200 flex-fill">
                    메인컨텐츠
                </div>
            </div>
            <br>
            <!-- footer -->
            <div class="flex-area left" style="border-top: 1px solid gray;">
                <div class="w-50">
                    <h2>KH정보교육원</h2>
                    <div class="flex-area flex-vertical">
                        <span>OO시 OO구 OO동 000-000번지</span>
                        <span>대표자 - 피카츄</span>
                        <span>고객센터 - (02) 1234-5678</span>
                    </div>
                </div>
                <div class="w-25">
                    <div class="flex-area flex-vertical">
                        <h2>지점 정보</h2>
                        <span>
                            강남지점
                            <a href="#"><i class="fa-solid fa-up-right-from-square"></i></a>
                        </span>
                        <span>
                            종로지점
                            <a href="#"><i class="fa-solid fa-up-right-from-square"></i></a>
                        </span>
                        <span>
                            당산지점
                            <a href="#"><i class="fa-solid fa-up-right-from-square"></i></a>
                        </span>
                        <span>
                            부산지점
                            <a href="#"><i class="fa-solid fa-up-right-from-square"></i></a>
                        </span>   
                    </div>
                </div>
                <div class="w-25">
                    <div class="flex-area flex-vertical center">
                        <h2>운영 방침</h2>
                        <span>
                            <a href="#">
                                <i class="fa-regular fa-clipboard"></i>
                                홈페이지 이용약관
                            </a>
                        </span>
                        <span>
                             <a href="#">
                                 <i class="fa-solid fa-user-lock"></i>
                                 개인정보 처리방침
                             </a>
                        </span>
                        <h2>파트너쉽</h2>
                        <div class="cell">
                            <i class="fa-brands fa-2x fa-google"></i>
                            <i class="fa-brands fa-2x fa-line"></i>
                            <i class="fa-brands fa-2x fa-facebook"></i>
                            <i class="fa-brands fa-2x fa-instagram"></i>
                            <i class="fa-brands fa-2x fa-linkedin"></i>
                        </div>
                    </div>
                </div>
            </div>


        </div>
        
    </div>

</body>
</html>
