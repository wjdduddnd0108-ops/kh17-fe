<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 디자인</title>

    <style>
        h1 {
            font-size: 20px;
        }
        @media (min-width:500px){
            h1{
                font-size: 26px;
                color: blue;
            }

        } 
        @media (min-width:1000px) {
            h1{
                font-size: 32px;
                color: green;
            }
        }
    </style>
</head>
<body>
    <h1>지금부터 반응형 디자인을 살펴봅시다</h1>
</body>
</html>
