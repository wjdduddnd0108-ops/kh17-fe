<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="/kh.png" type="image/png">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        /* div { box-shadow: 0 0 1px 0 gray; } */
        form { padding: 0 !important;}
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./preview.js"></script>

    <script>
        $(function(){
            //상태 객체
            var state = {
                bookTitleValid : false,
                bookAuthorValid : false,
                bookPublicationDateValid : false,
                bookPublishervalid : false,
                bookPriceValid : false,
                bookPageCountValid : false,
                bookGenreValid : false,
                ok : function(){
                    return Object.values(this)
                    .filter(v => typeof v == "boolean")
                    .every(v => v == true);
                }
            }

            //개별 입력창 검사
            $("[name=bookTitle]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookTitleValid = valid;
            })
            $("[name=bookAuthor]").on("blur", function(){
                var regex = /^[^!@#$]+$/;
                // 2. 비어있는지 확인 (공백만 있는 경우도 비어있다고 간주하려면 trim() 사용)
                if ($(this).val().length === 0) {
                    // 비어있다면 아무것도 하지 않고 true를 반환 (필수가 아니므로 통과)
                    state.bookAuthorValid = true;
                    return;
                }
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookAuthorValid = valid;
            })
             $("[name=bookPublisher]").on("blur", function(){
                var regex = /^[^!@#$]+$/;
                if ($(this).val().length === 0) {
                    state.bookPublisherValid = true;
                    return;
                }
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookPublisherValid = valid;
            })
            $("[name=bookPublicationDate]").on("input", function(){
                var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
                if ($(this).val().length === 0){
                    state.bookPublicationDateValid = true;
                    return;
                }
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookPublicationDateValid = valid;
            })
            $("[name=bookPrice]").on("blur", function(){
                var valid = $(this).val().length > 0 && parseInt($(this).val()) > 0; 
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookPriceValid = valid;
            })
            $("[name=bookPageCount]").on("blur", function(){
                 var valid = $(this).val().length > 0 && parseInt($(this).val()) > 0; 
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookPriceValid = valid;
            })
            $("[name=bookGenre]").on("input", function(){
                var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.bookGenreValid = valid;
            })

            //숫자 입력창 처리
            $("[inputmode=numeric]").on("input", function(){
                var value = $(this).val().replace(/[^0-9]/g, "");
                $(this).val(value); // 숫자가 아닌 문자는 즉시 제거
            });

            //폼검사
            $(".form-check").on("submit", function(){
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");
                
                return state.ok();
            });
        });
     </script>
    
  </head>
  <body>
  <form action="./insert" method="post" autocomplete="off" class="form-check">
    <div class="container my-5">
      <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                <h1>신규 도서 등록</h1>
                </div>
            </div>   
        </div>

    <!-- 실제로 구현할 내용들 -->
        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              도서명<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="text" name="bookTitle" class="form-control">
              <div class="invalid-feedback">필수 항목입니다</div>
          </div>
        </div>  

        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              지은이<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="text" name="bookAuthor" class="form-control">
              <div class="invalid-feedback">특수문자는 들어갈 수 없습니다</div>
          </div>
        </div> 
        
        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              출간일<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="date" name="bookPublicationDate" class="form-control">
              <div class="invalid-feedback">올바르지 않은 년도입니다</div>
          </div>
        </div>
        
        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              판매가<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="text" inputmode="numeric" name="bookPrice" class="form-control">
              <div class="invalid-feedback">0 이상의 숫자를 입력해주세요</div>
          </div>
        </div>

        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              출판사<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="text" name="bookPublisher" class="form-control">
          </div>
        </div>

        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              페이지 수<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9"> 
              <input type="text" inputmode="numeric" name="bookPageCount" class="form-control">
              <div class="invalid-feedback">0 이상의 숫자를 입력해주세요</div>
          </div>
        </div>

        <div class="row mt-4">
          <label class="col-sm-3 col-form-label">
              장르<i class="fa-solid fa-asterisk text-danger"></i>
          </label>
          <div class="col-sm-9">
            <select name="bookGenre" class="form-select">
                <option value="">선택하세요</option>
                <option>판타지</option>
                <option>교양</option>
                <option>소설</option>
                <option>역사</option>
                <option>과학</option>
                <option>추리소설</option>
                <option>자기계발</option>
                <option>수험서</option>
            </select>
            <div class="invalid-feedback">필수항목입니다</div>
          </div>
        </div> 

        <div class="row mt-4">
            <div class="col text-end">
                <a href="#" class="btn btn-outline-secondary">
                  <i class="fa-solid fa-list"></i>
                  목록으로
                </a>
                <button type="submit" class="btn btn-outline-primary"><i class="fa-solid fa-floppy-disk"></i>등록하기</button>
            </div>
        </div>
    </div>
  </form>
    <!--JS Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">

    </script>
  </body>
</html>
