<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="/kh.png" type="image/png">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        div { box-shadow: 0 0 1px 0 gray; }
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./preview.js"></script>
    
  </head>
  <body>
    <div class="container my-5">
      <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                <h1>국가 목록</h1>
                </div>
            </div>   
        </div>

    <!-- 실제로 구현할 내용들 -->
        <div class="row mt-4">
            <div class="col d-flex justify-content-center">
                <div class="input-group" style="max-width: 500px;">
                    <select name="column" class="form-select w-auto flex-grow-0">
                        <option value="country_name">국가명</option>
                        <option value="country_region">대륙명</option>
                        <option value="country_capital">수도명</option>
                    </select>
                    
                    <input type="text" class="form-control">
                    
                    <button type="button" class="btn btn-success text-nowrap">
                        <span class="d-none d-sm-inline">검색</span>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <!-- 테이블이 폭이 좁아지는 상황에 대비하여 반응형으로 준비(div wrapper 필요) -->
                <div class="text-nowrap table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>국가번호</th>
                        <th>국가명</th>
                        <th>수도명</th>
                        <th>인구</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1</td>
                        <td>대한민국</td>
                        <td>서울</td>
                        <td>50,000,000</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>일본</td>
                        <td>도쿄</td>
                        <td>100,000,000</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>미국</td>
                        <td>워싱턴</td>
                        <td>250,000,000</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>중국</td>
                        <td>베이징</td>
                        <td>1,400,000,000</td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

        <!-- 상황별로 다른 화면을 보여준다 -->
         <div class="row mt-4">
            <div class="col d-none d-sm-block">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled">
                        <a class="page-link" href="#">
                            <i class="fa-solid fa-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item active">
                        <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">3</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">4</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">5</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">6</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">7</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">8</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">8</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">9</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">10</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">
                            <i class="fa-solid fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col d-block d-sm-none">
                <button class="btn btn-primary w-100">
                    <i class="fa-solid fa-chevron-down"></i>
                    <span>더보기</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
        </div>



    </div>
    <!--JS Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">

    </script>
  </body>
</html>
