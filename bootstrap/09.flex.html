<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="/kh.png" type="image/png">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        div { box-shadow: 0 0 1px 0 gray; }
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./preview.js"></script>
    
  </head>
  <body>
    <div class="container my-5">
      <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                <h1>Flex 배치</h1>
                <p>연속해서 배치해야 하는 경우 Flex 처리 방법</p>
                </div>
            </div>   
        </div>

    <!-- 실제로 구현할 내용들 -->
        <div class="row mt-4">
            <label class="col-sm-3 col-form-label">이메일</label>
            <div class="col-sm-9 d-flex align-items-center">
                <input class="form-control">
                <i class="fa-solid fa-at mx-2"></i>
                <select class="form-select">
                    <option>gmail.com</option>
                    <option>naver.com</option>
                    <option>hanmail.net</option>
                </select>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col d-flex">
                <input type="text" class="form-control">
                <button type="button" class="btn btn-success ms-2 text-nowrap">
                    <!-- 글자를 좁은 화면에서 제거 -->
                    <span class="d-none d-sm-inline">검색</span>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <div class="input-group">
                    <input type="text" class="form-control">
                    <button type="button" class="btn btn-success text-nowrap">
                        <!-- 글자를 좁은 화면에서 제거 -->
                        <span class="d-none d-sm-inline">검색</span>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!--JS Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">

    </script>
  </body>
</html>
