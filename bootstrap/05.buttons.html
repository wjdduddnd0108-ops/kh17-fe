<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="/kh.png" type="image/png">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        div { box-shadow: 0 0 1px 0 gray; }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                <h1>버튼</h1>
                <p>부트스트랩 버튼을 만들어봅니다</p>
                </div>
            </div>   
        </div>

    <!-- 
        버튼: 눌러서 무언가를 실행할 수 있는 도구
        - 과거에는 .btn + btn-positive/neutral/negative 추가하여 구현

        - bootstrap 역시 .btn으로 시작    
        - 역할 키워드를 추가
            - primary는 현재 화면에서 가장 중요한 요소를 의미
            - secondary는 현재 화면에서 비교적 덜 중요한 요소를 의미
            - info는 저보를 제공하는 요소를 의미 
            - success는 성공을 유발하는 요소를 의미
            - warning은 경고가 필요한 요소를 의미 
            - danger는 위험한 요소를 의미
            - dark는 어두운 요소를 의미 (다크모드)
            - light는 밝은 요소를 의미 (라이트모드)
    -->
        <div class="row mt-4">
            <div class="col">
                <button class="btn btn-primary">버튼샘플</button>
                <button class="btn btn-secondary">버튼샘플</button>
                <button class="btn btn-info">버튼샘플</button>
                <button class="btn btn-success">버튼샘플</button>
                <button class="btn btn-warning">버튼샘플</button>
                <button class="btn btn-danger">버튼샘플</button>
                <button class="btn btn-dark">버튼샘플</button>
                <button class="btn btn-light">버튼샘플</button>
            </div>
        </div>

    <!-- outline 버튼이 존재 -->
        <div class="row mt-4">
            <div class="col">
                <button class="btn btn-outline-primary">버튼샘플</button>
                <button class="btn btn-outline-secondary">버튼샘플</button>
                <button class="btn btn-outline-info">버튼샘플</button>
                <button class="btn btn-outline-success">버튼샘플</button>
                <button class="btn btn-outline-warning">버튼샘플</button>
                <button class="btn btn-outline-danger">버튼샘플</button>
                <button class="btn btn-outline-dark">버튼샘플</button>
                <button class="btn btn-outline-light">버튼샘플</button>
            </div>
        </div>

        <!-- 크기 키워드를 조합할 수 있음(sm, lg) -->
        <div class="row mt-4">
            <div class="col">
                <button class="btn btn-sm btn-primary">버튼샘플</button>
                <button class="btn btn-primary">버튼샘플</button>
                <button class="btn btn-lg btn-primary">버튼샘플</button>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <button class="btn btn-lg btn-primary w-100">버튼샘플</button>
            </div>
        </div>

    </div>
    <!--JS Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">

    </script>
  </body>
</html>
