<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- favicon -->
    <link rel="icon" href="/kh.png" type="image/png">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet">
    <style>
        div { box-shadow: 0 0 1px 0 gray; }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                <h1>폼</h1>
                <p>각종 입력창과 배치 방법에 대해 배웁니다</p>
                </div>
            </div>   
        </div>

        <!-- 
            입력창에 부여하는 클래스가 과거와 달라진다
            .form-control는 input, textarea등 키보드 입력에 기반한 컴포넌트를 구현할 때 사용
            .form-select는 select를 구현할 때 사용

            자동으로 폭이 100%로 설정되므로 영역(col)으로 폭을 제어하는 것이 바람직함
        -->
        <div class="row mt-4">
            <div class="col">
                <input type="text" class="form-control">
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <select type="text" class="form-select">
                    <option>선택하세요</option>
                    <option>딸기</option>
                    <option>바나나</option>
                    <option>사과</option>
                </select>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <textarea class="form-control" rows="5" style="resize: none;"></textarea>
            </div>
        </div>

        <!-- 
            라벨이 있는 경우
            1. 라벨이 좌측에 있는 경우
            2. 라벨이 상단에 있는 경우
            3. 1번과 2번을 폭에 따라 결정하는 경우 (하이브리드)
        -->
        <div class="row mt-4">
            <label class="col-3 col-form-label">
                아이디
            </label>
            <div class="col-9">
                <input type="text" class="form-control">
            </div>
        </div>

        <div class="row mt-4">
            <label class="col-12 col-form-label">
                아이디
            </label>
            <div class="col-12">
                <input type="text" class="form-control">
            </div>
        </div>

        <div class="row mt-4">
            <label class="col-sm-3 col-form-label">
                아이디
            </label>
            <div class="col-sm-9">
                <input type="text" class="form-control">
            </div>
        </div>

        <div class="row mt-4">
            <label class="col-md-3 col-form-label">
                아이디 <i class="fa-solid fa-asterisk text-danger"></i>
            </label>
            <div class="col-md-9">
                <input type="text" class="form-control">
            </div>
        </div>

        <!-- 피드백 추가 -->
        <div class="row mt-4">
            <label class="col-sm-3 col-form-label">
                아이디
            </label>
            <div class="col-sm-9">
                <input type="text" class="form-control is-valid">
                <div class="valid-feedback">멋진 아이디입니다!</div>
                <div class="invalid-feedback">사용할 수 없는 아이디입니다</div>
            </div>
        </div>

        <div class="row mt-4">
            <label class="col-sm-3 col-form-label">
                아이디<i class="fa-solid fa-asterisk text-danger"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" class="form-control is-invalid">
                <div class="valid-feedback">멋진 아이디입니다!</div>
                <div class="invalid-feedback">사용할 수 없는 아이디입니다</div>
            </div>
        </div>

    </div>
    <!--JS Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">

    </script>
  </body>
</html>
