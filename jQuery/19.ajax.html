<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        // - 레거시 웹에서는 화면에 부수적인 기능을 구현할 때 사용
        // - 모던 웹에서는 모든 통신을 AJAX로 처리
        $(function(){
            //목표 : .btn-ajax를 누르면 다른 파일을 불러와서 .result에 표시
            $(".btn-ajax").on("click", function(){
                $.ajax({
                    url : "./18.datepicker.html",
                    success : function(response){
                        $(".result").text(response);
                    }
                });
            });

            //목표 : /btn-ajax를 누르면 Spring Boot로 요청을 보내서 받은 결과를 .result2에 표시
            $(".btn-ajax2").on("click", function(){
                $.ajax({
                    url : "http://localhost:8080/rest/test/hello",
                    success : function(response){
                        $(".result2").text(response);
                    }
                });
            });

            $(".btn-ajax3").on("click", function(){
                $.ajax({
                    // url : "http://localhost:8080/rest/test/plus?a=10&b=20",//GET
                    url : "http://localhost:8080/rest/test/plus",//POST
                    method : "post",
                    data : { a : 10 , b : 20},
                    success : function(response){
                        $(".result3").text(response);
                    }
                });
            });

            $(".btn-ajax4").on("click", function(){
                   //.field-ajax4에 있는 아이디를 불러와서 서버에 있냐고 물어본 뒤 답을 받아서 출력
                    var memberId = $(".field-ajax4").val();

                    //(중요) ajax는 꼭 필요한 상황에만 사용해야 한다 (즉, 불필요한 상황은 제거해야함)
                    var regex = /^[a-z][a-z0-9]{4,19}$/;
                    var valid = regex.test(memberId);
                    if(valid == false) return;

                    $.ajax({
                        //GET
                        //url : "http://localhost:8080/rest/test/check?memberId="+memberId,

                        //POST
                        url : "http://localhost:8080/rest/test/check",
                        method : "post",
                        data : {memberId : memberId}, //왼쪽이 이름, 오른쪽이 데이터 {key : value}
                        success : function(response){
                            $(".result4").text(response);
                            console.log(response);
                        }
                    });
                });
        });
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>AJAX 다루기</h1>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-positive btn-ajax">눌러보세요!</button>
            <div class="result"></div>
        </div>
        <div class="cell">
            <button type="button" class="btn btn-positive btn-ajax2">서버로 요청 보내기</button>
            <div class="result2"></div>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-positive btn-ajax3">덧셈 결과 요청</button>
            <div class="result3"></div>
        </div>
        
        <div class="cell">
            <input type="text" class="field field-ajax4">
            <button type="button" class="btn btn-positive btn-ajax4">아이디 중복 확인</button>
            <div class="result4"></div>
        </div>

    </div>
</body>
</html>
