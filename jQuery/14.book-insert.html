<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        $(function(){
            //상태 객체
            var state = {
                bookTitleValid : false,
                bookAuthorValid : false,
                bookPublicationDateValid : false,
                bookPriceValid : false,
                bookPageCountValid : false,
                bookGenreValid : false,
                ok : function(){
                    return Object.values(this)
                    .filter(v => typeof v == "boolean")
                    .every(v => v == true);
                }
            }

            //개별 입력창 검사
            $("[name=bookTitle]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookTitleValid = valid;
            })
            $("[name=bookAuthor]").on("blur", function(){
                var regex = /^[^!@#$]+$/;
                // 2. 비어있는지 확인 (공백만 있는 경우도 비어있다고 간주하려면 trim() 사용)
                if ($(this).val().length === 0) {
                    // 비어있다면 아무것도 하지 않고 true를 반환 (필수가 아니므로 통과)
                    state.bookAuthorValid = true;
                    return;
                }
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookAuthorValid = valid;
            })
            $("[name=bookPublicationDate]").on("input", function(){
                var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
                if ($(this).val().length === 0){
                    state.bookPublicationDateValid = true;
                    return;
                }
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookPublicationDateValid = valid;
            })
            $("[name=bookPrice]").on("blur", function(){
                var valid = $(this).val().length > 0 && parseInt($(this).val()) > 0; 
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookPriceValid = valid;
            })
            $("[name=bookPageCount]").on("blur", function(){
                 var valid = $(this).val().length > 0 && parseInt($(this).val()) > 0; 
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookPriceValid = valid;
            })
            $("[name=bookGenre]").on("input", function(){
                var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.bookGenreValid = valid;
            })

            //숫자 입력창 처리
            $("[inputmode=numeric]").on("input", function(){
                var value = $(this).val().replace(/[^0-9]/g, "");
                $(this).val(value); // 숫자가 아닌 문자는 즉시 제거
            });

            //폼검사
            $(".form-check").on("submit", function(){
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");
                
                return state.ok();
            });

             /*
                (+추가) 파일 처리
                - [name=attach]에 input이벤트가 발생하면 선택된 파일이 있을 경우 .preview에 미리보기 표시
                (1) 진짜로 파일을 읽어와서 미리보기가 가능한 형태의 src를 생성하나 뒤 설정하는 방법
                - 장점 : 브라우저 무관하고 동일한 처리가 가능

                - 단점 : 오래걸리고 코드 작성 난이도가 높음
                (2) 브라우저가 제공하는 미리보기 기능을 활용하는 방법
                - 장점 : 파일을 읽을 필요가 없음
                - 단점 : 생성한 주소를 반드시 수동으로 제거해야 메모리 관리가 가능
             */
            $("[name=attach]").on("input", function(){
                //this = 파일 입력창 (files라는 내부 입력창이 존재)
                
                //blob : binary lob 대용량 정보
                //clob : charactor lob 대용량 글자
                // if(이미 만들어진 파일이 있다면){
                //     제거를 하라!
                // }
                var originSrc = $(".preview").attr("src"); //현재 .priviewd의 src를 가져와서
                if(originSrc.startsWith("blob:")) { //생성된 주소가 존재한다면
                    URL.revokeObjectURL(originSrc); //생성된 주소를 제거(회수)하세요
                    console.log("기존 이미지를 제거했습니다");

                }

                //files는 자바스크립트 속성이기 때문에 아래와 같이 작성
                if(this.files.length > 0) { // 파일을 선택한 경우 (1개) (미리보기 생성)
                    var address = URL.createObjectURL(this.files[0]); // 파일을 주고 주소 생성 요청
                    $(".preview").attr("src", address); //이미지의 주소로 설정
                    
                }
                else{ // 파일을 취소한 경우 (미리보기 제거)
                    //.preview에 src를 "https://dummyimage.com/200x200?text=NO"로 설정
                    $(".preview").attr("src", "https://dummyimage.com/200x200?text=NO");
                }
            });
        });
     </script>
</head>
<body>
    <form action="./insert" autocomplete="off" method="post" enctype="multipart/form-data" 
        onsubmit="return checkForm();" class="form-check">
        <div class="container w-500 mt-50 mb-50">
            <div class="cell center">
                <h1>신규 도서 등록</h1>
            </div>
            <div class="cell">
                <label>도서명<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="bookTitle"
                class="field w-100">
                <div class="fail-feedback">필수 항목입니다</div>
            </div>
            <div class="cell">
                <label>지은이</label>
                <input type="text" name="bookAuthor"
                class="field w-100">
                <div class="fail-feedback">특수문자는 들어갈 수 없습니다</div>
            </div>
            <div class="cell">
                <label>출간일</label>
                <input type="date" name="bookPublicationDate"
                class="field w-100">
                <div class="fail-feedback">올바르지 않은 년도입니다</div>
            </div>
            <div class="cell">
                <label>판매가<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="bookPrice"
                class="field w-100" inputmode="numeric">
                <div class="fail-feedback">0 이상의 숫자를 입력해주세요</div>
            </div>
            <div class="cell">
                <label>출판사</label>
                <input type="text" name="bookPublisher"
                class="field w-100">
            </div>
            <div class="cell">
                <label>페이지 수<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="bookPageCount"
                class="field w-100" inputmode="numeric">
                <div class="fail-feedback">0 이상의 숫자를 입력해주세요</div>
            </div>
            <div class="cell">
                <label>장르<i class="fa-solid fa-asterisk red"></i></label>
                <select class="field w-100" name="bookGenre">
                    <option value="">선택하세요</option>
                    <option>판타지</option>
		            <option>교양</option>
		            <option>소설</option>
		            <option>역사</option>
		            <option>과학</option>
		            <option>추리소설</option>
		            <option>자기계발</option>
		            <option>수험서</option>
                </select>
                <div class="fail-feedback">필수 항목입니다.</div>
            </div>
            <div class="cell">
                <label>표지</label>
                <input type="file" name="attach" class="field w-100">
            </div>
            <!-- 미리보기 추가 -->
            <div class="cell">
                <img class="preview" src="https://dummyimage.com/200x200?text=NO" width="200" hegiht="200">
            </div>

            <div class="cell mt-50">
                <button class="btn btn-positive w-100">
                    등록하기
                </button>
            </div>
            <div class="cell mt-40">
                <a href="./list" class="btn btn-neutral w-100">
                    목록으로
                </a>
            </div>
        </div>
    </form>
</body>
</html>
