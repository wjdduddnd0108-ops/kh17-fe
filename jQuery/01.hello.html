<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        /*
        window.addEventListener("load", function(){
            document.querySelector(".btn").addEventListener("click", function(){
                document.querySelector(".target").style.color = "red";
            });
        })
        */

        //벌써부터 느껴지는 jQuery의 장점
        //1. 짧고 간결하고 명확하다
        //2. 개수 제한이 없다 (1개일 때와 여러개일 때의 코드가 같다)

        //jQuery는 무조건 $부터 시작 ($ 대신 jQuery라고 써도 됨)
        //문법 : $(대상) + 명령호출

        //$(window).on("load", function(){});//화면 로드
        //$(documnet).on("ready", function(){});//화면 로드 + jQuery 준비(jQuery가 만든 이벤트)
        //$(document).ready(function(){});
        //$().ready(function(){});
        //$(function(){});//우리가 쓸 최종 형태

        $(function(){

            //$를 이용해서 class="btn"을 선택한 뒤 click이벤트 설정
            //$(".btn").on("click", function(){});
            //$(".btn").click(function(){});

            $(".btn").on("click", function(){

                //$를 이용해서 class="target"을 선택한 뒤 css 변경을 지시
                //- css, value, textContent, attribute등 다양한 변경 지시가 가능
                $(".target").css("color", "red");
            });
        });
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>jQuery 샘플</h1>

</body>
</html>
