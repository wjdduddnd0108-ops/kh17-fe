<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디자인 수업</title>
  <link rel="icon" href="/kh.png" type="image/png">
  <!-- 아이콘 -->
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- 디자인을 작성하기 위한 영역 -->
  <link rel="stylesheet" type="text/css" href="../css/commons.css">
  <style>
    div {
      box-shadow: 0 0 0 1px #cccccc;
    }
  </style>

  <!-- chartjs CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jQuery CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- 자바스크립트 작성 영역 -->
  <script>
    $(function () {
      //데이터를 불러와서 차트를 그리는 함수
      function createChart(endpoint, selector) {
        $.ajax({
          url: "http://localhost:8080/rest/stat/"+endpoint,
          method: "post",
          success: function (response) {//response에 titles와 values가 담겨있음
            // const ctx = document.querySelector(".custom-chart");//js
            const ctx = $(selector)[0];//jqeury

            //차트 생성 - new Chart(태그, {옵션});
            new Chart(ctx, {

              //type은 차트의 유형 (bar/line/pie/doughnut)
              type: response.type,
              //data는 차트를 그리기 위한 값의 정보
              data: {
                //labels가 x축에 표시될 이름
                labels: response.titles,
                //datasets은 차트에 그릴 데이터 집합들 (복수개 가능)
                datasets: [
                  {
                    // label: '국가 수',//범례
                    data: response.values,//표시될 값
                    borderWidth: 1,//테두리두께
                    backgroundColor: [
                      "rgba(214, 48, 49,0.5)",
                      "rgba(225, 112, 85,0.5)",
                      "rgba(253, 203, 110,0.5)",
                      "rgba(0, 184, 148,0.5)",
                      "rgba(9, 132, 227,0.5)",
                      "rgba(116, 185, 255,0.5)",
                      "rgba(108, 92, 231,0.5)"
                    ],
                    borderColor: [
                      "rgba(214, 48, 49,1.0)",
                      "rgba(225, 112, 85,1.0)",
                      "rgba(253, 203, 110,1.0)",
                      "rgba(0, 184, 148,1.0)",
                      "rgba(9, 132, 227,1.0)",
                      "rgba(116, 185, 255,1.0)",
                      "rgba(108, 92, 231,1.0)"
                    ]
                  },
                ]
              },
              //차트를 표시하기 위한 옵션
              options: {
                scales: {
                  y: {
                    beginAtZero: true//y축을 무조건 0부터 시작하도록 처리
                  }
                },
                plugins: {
                  legend: { display: false }//범례제거
                }
              }
            });
          }
        });
      }

      //createChart 함수를 불러서 차트를 생성하도록 지시
      createChart("country-region", ".custom-chart");
      createChart("practice1-category", ".custom-chart2");
      createChart("practice1-course-type", ".custom-chart3");

    });
  </script>


</head>

<body>
  <div class="container w-600 mt-50 mb-50">
    <div class="cell center">
      <h1>차트 다루기</h1>
    </div>

    <div class="cell center">
      <h2>대륙별 국가 현황</h2>
    </div>
    <div class="cell">
      <canvas class="custom-chart"></canvas>
    </div>

    <div class="cell center">
      <h2>카테고리별 강좌 현황</h2>
    </div>
    <div class="cell">
      <canvas class="custom-chart2"></canvas>
    </div>

    <div class="cell center">
      <h2>유형별 강좌 현황</h2>
    </div>
    <div class="cell">
      <canvas class="custom-chart3"></canvas>
    </div>
  </div>
</body>

</html>
