<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        $(function(){
            //다음으로 넘기기
            $(".btn-next").on("click", function(){
                //목표 현재 페이지는 숨기고 다음페이지 보여주기
                //현재 페이지
                var current = $(".page:visible");
                //다음 페이지
                var next = current.next(".page");
                if(next.length > 0){
                    current.hide();
                    next.show();
                }

                if(next.next(".page").length === 0){
                    $(this).hide();//마지막일때 다음버튼 숨김
                }

                $(".btn-prev").show();

            });
            //이전으로 넘기기
            $(".btn-prev").on("click", function(){
                //목표 현재 페이지는 숨기고 다음페이지 보여주기
                //현재 보여지는 페이지
                var current = $(".page:visible");
                //이전 페이지
                var prev = current.prev(".page");
                if(prev.length > 0){
                    current.hide();
                    prev.show();
                }
                if(prev.prev(".page").length === 0){
                    $(this).hide();//마지막일때 다음버튼 숨김
                }

                $(".btn-next").show();

            });
        });
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>멀티페이지 </h1>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid;" display: block;>
            <h1 class="center">첫 번째 화면</h1>
            <span>1번 문제</span>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid; display: none;">
            <h1 class="center">두 번째 화면</h1>
            <span>2번 문제</span>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid; display: none;">
            <h1 class="center">세 번째 화면</h1>
            <span>3번 문제</span>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid; display: none;">
            <h1 class="center">네 번째 화면</h1>
            <span>4번 문제</span>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid; display: none;">
            <h1 class="center">다섯 번째 화면</h1>
            <span>5번 문제</span>
        </div>
        <div class="page w-100" style="height: 40em; border: 1px solid; display: none;">
            <h1 class="center">여섯 번째 화면</h1>
            <span>6번 문제</span>
        </div>
        <div class="cell center">
                <button type="button" class="left btn btn-neutral btn-prev" style="display: none;">이전</button>
                <button type="button" class="right btn btn-neutral btn-next">다음</button>
        </div>
    </div>
</body>
</html>
