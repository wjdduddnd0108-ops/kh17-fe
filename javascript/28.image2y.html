<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        window.addEventListener("load", function(){
            //화면 전체에 영향을 주는 데이터 (상태 데이터)
            var size = 300;

            var btn = document.querySelector(".btn-s");
            btn.addEventListener("click", function(){
                if(size == 100) return;
                var target = document.querySelector("img");
                size -= 50;
                target.width=size;

                var span = document.querySelector(".current");
                span.textContent = "현재 : "+size+"px";

            })

            var btn = document.querySelector(".btn-l");
            btn.addEventListener("click", function(){
                if(size == 500) return;
                var target = document.querySelector("img");
                size += 50;
                target.width=size;

                var span = document.querySelector(".current");
                span.textContent = "현재 : "+size+"px";
            })

        })
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>이미지 크기 조절</h1>
        </div>
        <div class="cell center">
            <button type="button" class="btn btn-s">작게</button>
            <span class="current">현재 : 300px</span>
            <button type="button" class="btn btn-l">크게</button>
        </div>
        <div class="cell center">
            <img src="https://picsum.photos/500" width="300">
        </div>



    </div>
</body>
</html>
