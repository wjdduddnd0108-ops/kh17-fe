<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        

        window.addEventListener("load", function(){

            var textareas = document.querySelectorAll(".textarea");
            var displays = document.querySelectorAll(".textarea-span");


            for(let i = 0; i < textareas.length; i++){
                textareas[i].addEventListener("input", function(){
                    displays[i].textContent = this.value.length;
            });
        }
        })
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>자기소개서</h1>
        </div>
        <div class="cell mt-40">
            <h3>(Q) 최근 가장 관심있게 본 IT 소식은 무엇입니까?</h3>
        </div>
        <div class="cell mb-50">
            <textarea class="field w-100 textarea" rows="10"></textarea>
            <div class="right">
                <span class="textarea-span">0</span> / 1000글자
            </div>
        </div>
        <div class="cell mt-40">
            <h3>(Q) 최근 가장 관심있게 본 IT 소식은 무엇입니까?</h3>
        </div>
        <div class="cell mb-50">
            <textarea class="field w-100 textarea" rows="10"></textarea>
            <div class="right">
                <span class="textarea-span">0</span> / 1000글자
            </div>
        </div>

            <h3>(Q) 최근 가장 관심있게 본 IT 소식은 무엇입니까?</h3>
        </div>
        <div class="cell mb-50">
            <textarea class="field w-100 textarea" rows="10"></textarea>
            <div class="right">
                <span class="textarea-span">0</span> / 1000글자
            </div>
        </div>

    </div>
</body>
</html>
