<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}

        img {
            transition-property: width, height;
            transition-duration: 0.1s;
            transition-timing-function: ease-out;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //이미지 크기 작게(150x150) 만드는 함수
        function changeSmall(){
            //이미지를 제어하려면 CSS처럼 대상을 선택할 수 있어야 한다
            //명령 : document.querySelector("CSS선택자");
            var target = document.querySelector("img");

            //target의 width 속성을 150으로 변경한다
            target.width = 150;
        }

        //이미지 크기를 보통(300x300)으로 만드는 함수
        function changeNormal(){
            var target = document.querySelector("img");
            target.width = 300;
        }

        //이미지 크기를 크게(450x450)으로 만드는 함수
        function changeLarge(){
            var target = document.querySelector("img");
            target.width = 450;
        }
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>이미지 크기 조절 예제</h1>
        </div>
        <div class="cell center">
            <button type="button" class="btn" onclick="changeSmall()">작게</button>
            <button type="button" class="btn" onclick="changeNormal()">보통</button>
            <button type="button" class="btn" onclick="changeLarge()">크게</button>
        </div>
        <div class="cell center">
            <img src="https://picsum.photos/500" width="300">
        </div>

    </div>
</body>
</html>
