<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        // 아이디 검사 및 피드백 설정
        function checkMemberId(){
            var input = document.querySelector("[name=q1]");
            var div = input.nextElementSibling;//바로 뒤에 있는 태그
            var span = div.children[0];//div 아래 있는 첫번째 span

            //id 정규 표현식
            var regex = /^[a-z][a-z0-9]{4,19}$/;
            span.classList.remove("red", "blue");
            if(regex.test(input.value)){//정규표현식 통과했다면
                span.textContent ="멋진 아이디입니다!";
                span.classList.add("blue");
            }
            else{//통과 못했다면
                span.textContent = "5~20자의 영문 소문자로 시작하며 5~20자의 영문 소문자, 숫자를 사용 가능합니다";
                span.classList.add("red");
            }

        }
        //비밀번호 검사 및 피드백 설정
        function checkMemberPassword(){
            var input = document.querySelector("[name=q2]");
            var div = input.nextElementSibling;//바로 뒤에 있는 태그
            var span = div.children[0];//div 아래 있는 첫번째 span

            //id 정규 표현식
            var regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+[\]{}|\\:;"'<>,.?/~`-])[A-Za-z\d!@#$%^&*()_+[\]{}|\\:;"'<>,.?/~`-]{8,16}$/;
            span.classList.remove("red", "blue");
             if(regex.test(input.value)){//정규표현식 통과했다면
                span.textContent ="올바른 형식의 비밀번호입니다";
                span.classList.add("blue");
            }
            else{//통과 못했다면
                span.textContent = "8~16자의 사이 소문자,대문자,숫자,특수문자 반드시 1개이상 포함하여 작성하세요";
                span.classList.add("red");
            }

            var input2 = document.querySelector(".password-check");
            var div2 = input2.nextElementSibling;//바로 뒤에 있는 태그
            var span2 = div2.children[0];//div 아래 있는 첫번째 span

            span2.classList.remove("red", "blue");
            //비밀번호가 없는 경우를 고려
            if(input.value.length == 0){
                span2.textContent = "비밀번호를 먼저 입력하세요";
                span2.classList.add("red");
            }
            else if(input.value === input2.value){//위에 비밀번호와 일치할때
                span2.textContent ="비밀번호 일치";
                span2.classList.add("blue");
            }
            else{
                span2.textContent ="비밀번호 불일치";
                span2.classList.add("red");
            }
        }
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>회원가입</h1>
        </div>
        <div class="cell" style="margin-bottom: -20px;">
            <h2>아이디<span class="red">*</span></h2> 
        </div>
        <div class="cell" >
            <input type="text" name="q1" class="field w-100" oninput="checkMemberId();">
            <!-- 피드백 영역은 찾기쉽게 입력창의 바로 뒤에 두자 -->
            <div>
                <span>아이디를 입력하세요</span>
            </div>
        </div>
        
        <!-- 비밀번호 -->
        <div class="cell" style="margin-bottom: -20px;">
            <h2>비밀번호<span class="red">*</span></h2> 
        </div>
        <div class="cell">
            <input type="password" name="q2" class="field w-100" oninput="checkMemberPassword();">
            <div>
                <span>비밀번호를 입력하세요</span>
            </div>
        </div>

        <!-- 비밀번호 재확인: 전송을 안하므로 name 대신 class 부여 -->
        <div class="cell" style="margin-bottom: -20px;">
            <h2>비밀번호 확인<span class="red">*</span></h2> 
        </div>
        <div class="cell">
            <input type="password" class="field w-100 password-check" oninput="checkMemberPassword();">
            <!-- 피드백 바로 뒤에 붙이기만 해도됨 span안쓰고 -->
            <div>
                <span></span>
            </div>
        </div>


    </div>
</body>
</html>
