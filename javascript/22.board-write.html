<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //제목 검사
        function checkBoardTitle(){
            var tag = document.querySelector("[name=boardTitle]");
            var valid = tag.value.length > 0;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkBoardHead(){
            var tag = document.querySelector("[name=boardHead]");
            var regex = /(공지|유머|자유|정보)$/;
            var valid = tag.value.length == 0 || regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        //글자수 제한 및 글자수 보여주기
        function calculateBoardContent(){
            var textarea = document.querySelector("[name=boardContent]");
            var size = textarea.value.length;
            var div = textarea.nextElementSibling.nextElementSibling;
            var span = div.children[0];
            span.textContent = size;

            if(size > 1000){
                var newContent = textarea.value.substring(0,1000);
                textarea.value = newContent;
                span.textContent = "1000";
                span.classList.add("red");
            }
            else{
                span.classList.remove("red");
            }
        }
        function checkBoardContent(){
            var tag = document.querySelector("[name=boardContent]");
            var valid = tag.value.length > 0 && tag.value.length <= 1000;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkForm(){
            var boardTitleValid = checkBoardTitle();
            var boardHeadValid = checkBoardHead();
            var boardContentValid = checkBoardContent();
            return boardTitleValid && boardHeadValid && boardContentValid;
        }
     </script>
</head>
<body>
    <!-- 디자인 강사님꺼 가져옴 -->

<form action="./write" method="post" onsubmit="return checkForm();">
    <c:if test="${param.boardParent != null}">
        <input type="hidden" name="boardParent" value="${param.boardParent}">
    </c:if>
    <div class="container w-950 mt-50 mb-50">
        <div class="cell">
            <!-- 제목을 답글일 때와 새글일 때로 나눠서 처리 -->
            <c:if test="${param.boardParent == null}">
            <h1 class="mt-0 mb-0">신규 글 작성</h1>
            </c:if>
            <c:if test="${param.boardParent != null}">
            <h1 class="mt-0 mb-0">답변 글 작성</h1>
            </c:if>
        </div>
        <div class="cell">
            타인에 대한 무분별한 비방글은 경고 없이 삭제될 수 있습니다
        </div>
        
        <div class="cell mt-40">
            <label>제목 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="boardTitle" class="field w-100" onblur="checkBoardTitle();">
            <div class="fail-feedback">필수항목입니다.</div>
        </div>
        <div class="cell mb-0">
            <label>말머리</label>
        </div>
        <div class="cell mt-0">
            <select name="boardHead" class="field" oninput="checkBoardHead();">
                <option value="">선택 안함</option>
                <c:if test="${sessionScope.loginLevel == '마스터'}">
                <!-- 공지는 관리자에게만 보이도록 해야함 -->
                    <option>공지</option>
                </c:if>
                <option>정보</option>
                <option>유머</option>	
                <option>자유</option>		
            </select>
        </div>
        <div class="cell">
            <label>내용 <i class="fa-solid fa-asterisk red"></i></label>
            <textarea name="boardContent" rows="10" class="field w-100" oninput="calculateBoardContent();" 
                onblur="checkBoardContent();"></textarea>
            <div class="fail-feedback">내용은 필수 항목이며 1000글자 이내로 작성해야 합니다</div>
            <div class="right">
                <span>0</span> / 1000글자
            </div>
        </div>
        
        <div class="cell mt-50 right">
            <a href="./list" class="btn btn-neutral">
                <i class="fa-solid fa-list"></i>
                <span>목록으로 이동</span>
            </a>
            <button type="submit" class="btn btn-positive">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>글 등록하기</span>
            </button>
        </div>
    </div>
	
</form>


</body>
</html>
