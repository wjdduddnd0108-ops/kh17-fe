<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문</title>

    <script>
        //자바스크립트의 제어문(조건, 반복문)
        //- 자바와 동일(if, switch, for, while, do-while)

        var number = 10;

        if(number % 2 == 0){
            console.log("짝수");
        }
        else{
            console.log("홀수");
        }

        //(ex) 1부터 10까지 더해서 출력
        // var total = 1 + 2 + 3 + 4 + 5 + 6... + 10;
        var total = 0;
        for(var i=0; i<=10; i++){
            total += i;
        }
        console.log(total);
    </script>


</head>
<body>
    
</body>
</html>
