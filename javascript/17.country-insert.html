<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //대륙명
        function checkCountryRegion(){
            var tag = document.querySelector("[name=countryRegion]");
            // var valid = tag.value.legth > 0;//빈칸만 아니면 됨
            var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }

        // 국가명 
        function checkCountryName(){
            var tag = document.querySelector("[name=countryName]");
            var regex = /^[가-힣]{1,10}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        // 수도명
        function checkCountryCapital(){
            var tag = document.querySelector("[name=countryCapital]");
            var regex = /^[가-힣]{1,12}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        // 인구수 숫자 입력 필드는 숫자만 입력되도록 처리하는 것이 좋을 수도 있다
        function filterCountryPopulation(){
            var tag = document.querySelector("[name=countryPopulation]");
            var regex = /[^0-9]+/g;//g(lobal)를 붙이면 개수 제한 없이 다 적용됨
            var replacement = tag.value.replace(regex,"");
            tag.value = replacement;
        }
        function checkCountryPopulation(){
            var tag = document.querySelector("[name=countryPopulation]");
            // 음수만 아니면
            // var regex = /^[0-9]+$/;
            // var valid = regex.test(tag.value);
            var valid = tag.value.length > 0 && parseInt(tag.value) > 0; 
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }

     </script>
</head>
<body>
    <form autocomplete="off" method="post" enctype="multipart/form-data">
    <div class="container w-500 mt-50 mb-50">
        <div class="cell center">
            <h1>국가 정보 등록</h1>
        </div>
        <div class="cell">
            <label>대륙명 <i class="fa-solid fa-asterisk red"></i></label>
            <select class="field w-100" name="countryRegion" oninput="checkCountryRegion();">
                <option value="">선택하세요</option>
                <option>아시아</option>
                <option>아프리카</option>
                <option>북아메리카</option>
                <option>남아메리카</option>
                <option>유럽</option>
                <option>오세아니아</option>
            </select>
            <!-- <div class="success-feedback"></div> -->
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>국가명 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="countryName"
                class="field w-100"
                placeholder="e.g., 대한민국" onblur="checkCountryName();">
                <!-- <div class="success-feedback">올바른 국가명입니다</div> -->
                <div class="fail-feedback">한글 10글자 이내로 올바른 국가명을 작성해주세요.</div>
        </div>
        <div class="cell">
            <label>수도명 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="countryCapital"
                class="field w-100"
                placeholder="e.g., 서울" onblur="checkCountryCapital();">
                <!-- <div class="success-feedback">올바른 수도명입니다</div> -->
                <div class="fail-feedback">한글 12글자 이내로 올바른 수도명을 작성해주세요.</div>
        </div>
        <div class="cell">
            <label>인구수 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric"
                name="countryPopulation"
                class="field w-100"
                placeholder="e.g., 55000000" onblur="checkCountryPopulation();" 
                oninput="filterCountryPopulation();">
                <div class="fail-feedback">0 이상의 숫자를 입력해주세요</div>
        </div>
        <div class="cell mt-40">
            <button class="btn btn-positive w-100">등록하기</button>
        </div>
         <div class="cell mt-40">
            <a href="./list" class="btn btn-neutral w-100">목록으로</a>
        </div>
    </div>
    </form>
</body>
</html>
