<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        /* div {box-shadow: 0 0 0 1px #cccccc;} */
        .display{
            font-size: 24px;
            padding: 0.5em;
            min-height: 2.5em;
            word-break: break-all;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        function numberPad(number) {
            var target = document.querySelector(".display");
            target.textContent += number;
        }
        function clearAll() {
            var target = document.querySelector(".display");
            target.textContent = "";
        }

        function clearOne() {
            //마지막 한 글자를 지운다 = 입력글자를 꺼내와서 끝부분을 잘라낸 뒤 재설정
            // = 잘라내는 명령 - substring(시작점, 끝점)
            // = 글자수 구하기 - length
            var display = document.querySelector(".display");
            var origin = display.textContent;
            var cut = origin.substring(0,origin.length-1);
            display.textContent = cut;
        }
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>휴대전화 키패드 문제</h1>
        </div>
        <div class="cell">
            <!-- <input type="text" class="field w-100 display" placeholder="전화번호 입력"> -->
            <div class="display"></div>
        </div>
        <div class="cell center mb-30">
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('7')">
                <i class="fa-solid fa-7"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('8')">
                <i class="fa-solid fa-8"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('9')">
                <i class="fa-solid fa-9"></i>
            </button>
        </div>
        <div class="cell center mb-30">
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('4')">
                <i class="fa-solid fa-4"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('5')">
                <i class="fa-solid fa-5"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('6')">
                <i class="fa-solid fa-6"></i>
            </button>
        </div>
        <div class="cell center mb-30">
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('1')">
                <i class="fa-solid fa-1"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('2')">
                <i class="fa-solid fa-2"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('3')">
                <i class="fa-solid fa-3"></i>
            </button>
        </div>
        <div class="cell center mb-30">
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('*')">
                <i class="fa-solid fa-star-of-life"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('0')">
                <i class="fa-solid fa-0"></i>
            </button>
            <button type="button" class="btn btn-neutral" style="width: 30%;" onclick="numberPad('#')">
                <i class="fa-solid fa-hashtag"></i>
            </button>
        </div>
        <div class="cell center">
            <button type="button" class="btn btn-negative" style="width: 45%;" onclick="clearOne()">
                <i class="fa-solid fa-delete-left"></i>
                한글자 지우기
            </button>
            <button type="button" class="btn btn-negative" style="width: 45%;" onclick="clearAll()">
                <i class="fa-solid fa-rotate-right"></i>
                전부 지우기
            </button>
        </div>
    </div>
</body>
</html>
