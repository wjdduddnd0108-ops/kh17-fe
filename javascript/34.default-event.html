<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //목표는 : check-link를 클릭했을 때 확인창을 출력하고 예를 누르면 진행, 아니면 차단
        //- 모든 이벤트 처리 함수에는 첫 번째 인자로 이벤트 정보가 들어온다
        window.addEventListener("load", function(){
            var link = document.querySelector(".check-link");
            link.addEventListener("click", function(e){
                // return false;//작동하지 않음
                // console.log(e);
                // e.preventDefault();//전송 중지 (기본 이벤트 실행 차단)

                var choice = window.confirm("정말 이동하시겠습니까?");
                if(choice == false) e.preventDefault();
            });

            var form = document.querySelector(".check-form");
            link.addEventListener ("click", function(e){
                var choice = window.confirm("정말로 전송하시겠습니까?");
                if(choice == false) e.preventDefault();
            })
        });
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>기본 이벤트의 제어</h1>
        </div>

        <!-- 
            a, form과 같이 태그에 내장된 이벤트가 존재하는 경우 이를 통제할 수 있어야 한다 
        -->

        <div class="cell">
            <a href="https://www.google.com" class="btn btn-neutral w-100 check-link">구글로 이동</a>
        </div>

        <div class="cell mt-40">
            <form action="https://www.google.com" method="get" class="check-form">
                <button type="submit" class="btn btn-neutral w-100">구글로 이동</button>
            </form>
        </div>
    </div>
</body>
</html>
