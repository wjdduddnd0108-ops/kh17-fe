<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}

        /* 체크 상태에 따른 아이콘 표시 제어 */
        .togglebox { display: none; }
        .togglebox ~ .blue { display: none;}
        .togglebox ~ .red { display: inline;}
        .togglebox:checked ~ .blue { display: inline;}
        .togglebox:checked ~ .red { display: none;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        function passwordCheck(){
            var input = document.querySelector(".password");
            var input2 = document.querySelector(".password-check");
            var valid = input.value == input2.value;
            // console.log(valid);
            input2.classList.remove("success", "fail");//클래스 초기화
            input2.classList.add(valid ? "success" : "fail");//클래스 추가

        }

        //체크 상태에 따라 비밀번호 입력창들의 상태를 text와 password 사이에서 교차(toggle)
        function togglePassword(){
             var toggleBox = document.querySelector(".togglebox");

            //toggleBox.checked가 true면 표시(type=text), false면 숨김(type=password)
            var fields = document.querySelectorAll(".password, .password-check");
            for(var i=0; i < fields.length; i++) {
                fields[i].type = toggleBox.checked ? "text" : "password";
            }
        }

        //체크표시하면 비밀번호 보여주기
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>비밀번호 표시 및 숨김 처리</h1>
        </div>
        <div class="cell mt-50">
            <label>비밀번호 입력 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" class="field w-100 password" oninput="passwordCheck();">
            <div class="success-feedback">올바른 비밀번호 형식입니다</div>
            <div class="fail-feedback">영문 대소문자, 숫자, 특수문자를 반드시 포함한 8~16글자로 작성하세요</div>
            <label onclick="togglePassword();">
                <input type="checkbox" class="togglebox" oninput="togglePassword();">
                <div class="blue">
                    <i class="fa-solid fa-eye blue"></i>
                    <span>비밀번호 표시중...</span>
                </div>
                <div class="red">
                    <i class="fa-solid fa-eye-slash red"></i>
                    <span>비밀번호 미표시중...</span>
                </div>
            </label>
        </div>
        <div class="cell mt-50">
            <label>비밀번호 확인 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" class="field w-100 password-check" oninput="passwordCheck();">
            <div class="success-feedback">비밀번호 일치합니다</div>
            <div class="fail-feedback">비밀번호 일치하지 않습니다</div>
        </div>


    </div>
</body>
</html>
