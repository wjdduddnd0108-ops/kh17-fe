<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}

        /* 
            피드백 디자인
            - 자바스크립트와 결합하여 입력창의 피드백을 표시하기 위한 디자인
            - .field에 .success가 붙으면 뒤에 있는 .success-feedback을 출력
            - .field에 .fail이 붙으면 뒤에 있는 .fail-feedback을 출력
            - .field에 .success나 .fail이 붙으면 상황에 맞게 입력창도 디자인
            - .field에 우측 여백을 주고 상황에 맞는 이미지를 출력 (background-image)
        */
        .field ~ .success-feedback {
            color: #0984e3;
            display: none;
        }
        .field ~ .fail-feedback {
            color: #d63031;
            display: none;
        }
        .field.success ~ .success-feedback {
            display: block;
        }
        .field.fail ~ .fail-feedback {
            display: block;
        }
        .field{
            background-size: 1em;
            background-repeat: no-repeat;
            background-position-x: right 0.5em;
            background-position-y: center;
            padding-right: 2em;
        }
        .field.success{
            background-image: url("/images/valid.png");
            border-color: #0984e3;
        }
        .field.fail{
            background-image: url("/images/invalid.png");
            border-color: #d63031;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //아이디 검사 및 판정 함수
        function checkMemberId(){
            var tag = document.querySelector("[name=memberId]");//태그 선택
            var regex = /^[a-z][a-z0-9]{4,19}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");//클래스 초기화
            tag.classList.add(valid ? "success" : "fail");//클래스 추가
        }
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>제목</h1>
        </div>

        <!-- 
            이제부터는 하나의 입력창에 라벨 + 입력태그 + 성공피드백 + 실패피드백을 모두 구현
            단, 피드백은 최초에는 숨겨두고 *특정 상황* 에서만 보이도록 처리

            .success-feedback은 성공 시 보여줄 메세지가 적힌 영역
            .fail-feedback은 실패 시 보여줄 메세지가 적힌 영역
        -->
        <div class="cell">
            <label>아이디 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="memberId" class="field w-100" oninput="checkMemberId();">
            <div class="success-feedback">멋진 아이디입니다!</div>
            <div class="fail-feedback">영문 소문자로 시작하며 숫자 포함 5~20글자로 작성하세요</div>
        </div>
    </div>
</body>
</html>
