<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
     <link rel="icon" href="/kh.png" type="image/png">
    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {box-shadow: 0 0 0 1px #cccccc;}
        .display{
            font-size: 24px;
            padding: 0.5em;
            min-height: 2.5em;
            word-break: break-all;
            
        }
        .outer{
            padding: 5px;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        function bankMoney(money){
            var display = document.querySelector(".display");
            var subdisplay = document.querySelector(".sub-display");
            // 현재 입력창 숫자로 바꿈
            var currentVal = parseInt(display.textContent) || 0;
            // 새로 들어온 돈을 숫자로 바꿈
            var addVal = parseInt(money);
            var sum = currentVal + addVal;

            display.textContent = sum;
            subdisplay.textContent = sum.toLocaleString();

            //글자 index크기에 따라 숫자 부여
            console.log(display.textContent.length);
            //맨 처음에 총 크기를 받고 그 크기에 따라 인덱스 값들 
            console.log(display.textContent.charAt(0));
        }


        
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>은행 이체 문제</h1>
        </div>
        <div class="cell">
            <div class="display right"></div>
        </div>
        <div class="flex-area flex-center">
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(10000000)">천만</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(1000000)">백만</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(100000)">십만</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(10000)">만</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(1000)">천</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(100)">백</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(10)">십</button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral" onclick="bankMoney(1)">일</button>
            </div>
        </div>
        <div class="cell blue">
            이체하시려는 금액은 총 <span class="sub-display">0</span>원 입니다
        </div>


    </div>
</body>
</html>
